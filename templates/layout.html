{{ define "layout.html" }}
  <!doctype html>
  <html lang="{{ .Locale }}">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>{{ call .T `metadata.title` }}</title>
      <meta name="description" content="{{ call .T `landing.hero.subtitle` }}" />
      <meta name="author" content="Ewerton de Souza" />
      <!-- Let search and AI engines quote the page in full. -->
      <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

      <!-- SEO -->
      <link rel="icon" href="/static/images/logo.svg" type="image/svg+xml" />
      <link rel="canonical" href="{{ .SiteOrigin }}/{{ .Locale }}" />
      <link rel="alternate" hreflang="en" href="{{ .SiteOrigin }}/en" />
      <link rel="alternate" hreflang="pt-br" href="{{ .SiteOrigin }}/pt-br" />
      <link rel="alternate" hreflang="x-default" href="{{ .SiteOrigin }}/en" />

      <!-- Machine-readable resume, in every format it is published in -->
      <link
        rel="alternate"
        type="application/json"
        href="/{{ .Locale }}{{ .ResumeJSONPath }}"
        title="JSON Resume"
      />
      <link rel="alternate" type="text/markdown" href="/{{ .Locale }}{{ .ResumeMDPath }}" title="Resume (Markdown)" />
      <link rel="alternate" type="application/pdf" href="/{{ .Locale }}{{ .ResumePath }}" title="Resume (PDF)" />
      <link rel="describedby" type="text/plain" href="/llms.txt" />

      <!-- Open Graph -->
      <meta property="og:type" content="profile" />
      <meta property="og:url" content="{{ .SiteOrigin }}/{{ .Locale }}" />
      <meta property="og:title" content="{{ call .T `metadata.title` }}" />
      <meta property="og:description" content="{{ call .T `landing.hero.subtitle` }}" />
      <meta property="og:image" content="{{ .SiteOrigin }}/static/images/og-card-{{ .Locale }}.jpg" />
      <meta property="og:image:width" content="1200" />
      <meta property="og:image:height" content="630" />
      <meta property="og:image:type" content="image/jpeg" />
      <meta property="og:image:alt" content="{{ call .T `metadata.title` }}" />
      <meta property="og:site_name" content="{{ .SiteName }}" />
      <meta property="og:locale" content="{{ if eq .Locale `pt-br` }}pt_BR{{ else }}en_US{{ end }}" />
      <meta property="profile:first_name" content="Ewerton" />
      <meta property="profile:last_name" content="de Souza" />

      <!-- Twitter Card -->
      <meta name="twitter:card" content="summary_large_image" />
      <meta name="twitter:title" content="{{ call .T `metadata.title` }}" />
      <meta name="twitter:description" content="{{ call .T `landing.hero.subtitle` }}" />
      <meta name="twitter:image" content="{{ .SiteOrigin }}/static/images/og-card-{{ .Locale }}.jpg" />
      <meta name="twitter:image:alt" content="{{ call .T `metadata.title` }}" />

      <!-- schema.org graph: Person, ProfilePage, credentials, employment history
           and the products, all generated from the same model as the resume. -->
      <script type="application/ld+json">
        {{ .JSONLD }}
      </script>

      <!-- Google Fonts -->
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
      />

      <!-- Stylesheet -->
      <link rel="stylesheet" href="{{ .CSSPath }}" />

      <!-- Prevent theme flash -->
      <script>
        (function () {
          var theme = localStorage.getItem("theme");
          if (!theme) {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", theme);
        })();
      </script>
      <!-- Google tag (gtag.js) -->
      <script async src="https://www.googletagmanager.com/gtag/js?id={{ .GoogleAnalID }}"></script>
      <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() {
          dataLayer.push(arguments);
        }
        gtag("js", new Date());

        gtag("config", "{{ .GoogleAnalID }}");
      </script>
    </head>
    <body>
      {{ block "content" . }}{{ end }}
      <script src="{{ .JSPath }}"></script>
    </body>
  </html>
{{ end }}
